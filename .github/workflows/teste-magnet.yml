
name: Conversor Magnet

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link do 1Fichier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  analisar-pagina:
    runs-on: ubuntu-latest
    steps:
      - name: Examinar pagina do 1Fichier
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "Acessando pagina..."

          curl -sS -L \
            --max-time 45 \
            -A "Mozilla/5.0" \
            "$LINK" -o pagina.html

          echo "Analisando pagina..."

          python3 - <<'PY'
          from html.parser import HTMLParser

          class Analisador(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.form = None
                  self.forms = []
                  self.links = []
                  self.anchor = None

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)

                  if tag == "form":
                      self.form = {
                          "action": a.get("action", ""),
                          "method": a.get("method", "get"),
                          "fields": []
                      }
                      self.forms.append(self.form)

                  elif tag == "input" and self.form is not None:
                      self.form["fields"].append(
                          (a.get("name", ""), a.get("type", "text"))
                      )

                  elif tag == "a":
                      self.anchor = [a.get("href", ""), ""]

              def handle_data(self, data):
                  if self.anchor:
                      self.anchor[1] += data.strip() + " "

              def handle_endtag(self, tag):
                  if tag == "a" and self.anchor:
                      href, label = self.anchor
                      if any(x in (href + label).lower()
                             for x in ["download", "telecharger",
                                       "télécharger", "wait"]):
                          self.links.append((href, label.strip()))
                      self.anchor = None

                  elif tag == "form":
                      self.form = None

          parser = Analisador()
          with open("pagina.html", encoding="utf-8",
                    errors="replace") as f:
              parser.feed(f.read())

          print("FORMULARIOS ENCONTRADOS:")
          for form in parser.forms:
              print("Metodo:", form["method"])
              print("Campos:", form["fields"])
              print("---")

          print("LINKS DE DOWNLOAD:")
          for href, label in parser.links:
              print(label, href)

          print("ANALISE FINALIZADA")
          PY
