
name: Conversor Magnet

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Cole o link do 1Fichier"
        required: true
        type: string

jobs:
  verificar-link:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar link
        run: |
          echo "Verificando o link informado..."
          URL="${{ inputs.link }}"

          if [[ "$URL" != https://1fichier.com/* ]]; then
            echo "Link não reconhecido."
            exit 1
          fi

          echo "Link recebido:"
          echo "$URL"
          echo "Verificação inicial concluída."
