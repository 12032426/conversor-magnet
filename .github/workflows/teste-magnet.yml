name: Conversor Magnet

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link do 1Fichier"
        required: true
        type: string

permissions:
  contents: read

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - name: Investigar pagina
        env:
          LINK: ${{ inputs.link }}
        run: |
          curl -sS -L --max-time 45 \
            -A "Mozilla/5.0" \
            "$LINK" -o pagina.html

          python3 - <<'PY'
          from html.parser import HTMLParser

          class Leitor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.titulo = ""
                  self.textos = []

              def handle_starttag(self, tag, attrs):
                  if tag == "title":
                      self.title = True

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.title = False

              def handle_data(self, data):
                  texto = data.strip()
                  if texto:
                      if self.title:
                          self.titulo += texto
                      if any(p in texto.lower() for p in
                             ["download", "wait", "captcha",
                              "password", "error", "file"]):
                          self.textos.append(texto[:200])

          leitor = Leitor()
          with open("pagina.html", encoding="utf-8",
                    errors="replace") as f:
              leitor.feed(f.read())

          print("TITULO:", leitor.titulo)
          print("MENSAGENS ENCONTRADAS:")
          for texto in leitor.textos[:20]:
              print("-", texto)

          print("INVESTIGACAO CONCLUIDA")
          PY
