<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor Magnet</title>
<style>
body {
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
}
.container {
  max-width: 650px;
  margin: 40px auto;
  padding: 25px;
  background: #1c2638;
  border-radius: 15px;
}
h1 { color: #a78bfa; }
input, button {
  width: 90%;
  padding: 13px;
  margin: 12px 0;
  border-radius: 8px;
  border: none;
}
button {
  background: #7048e8;
  color: white;
  cursor: pointer;
  font-weight: bold;
}
#resultado {
  overflow-wrap: anywhere;
  color: #8ee6b5;
}
</style>
</head>
<body>
<div class="container">
<h1>Conversor Magnet</h1>
<p>Gere um link Magnet a partir de um arquivo do computador.</p>

<input type="file" id="arquivo">
<button onclick="gerar()">Gerar Magnet</button>

<p id="resultado"></p>
</div>

<script>
async function gerar() {
  const arquivo = document.getElementById("arquivo").files[0];
  const resultado = document.getElementById("resultado");

  if (!arquivo) {
    resultado.textContent = "Selecione um arquivo primeiro.";
    return;
  }

  resultado.textContent =
    "Arquivo selecionado: " + arquivo.name +
    ". A criação do torrent ainda precisa ser integrada.";
}
</script>
</body>
</html>
